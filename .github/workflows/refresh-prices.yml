name: Refresh prices
on:
  schedule:
    - cron: "17 11 * * *"   # primary: ~7:17 AM ET (11:17 UTC during EDT; 6:17 AM ET in winter)
    - cron: "17 14 * * *"   # backup: ~10:17 AM ET; skipped automatically if the primary already ran
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: refresh-prices, cancel-in-progress: false }   # one run at a time; later runs queue
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip backup run if prices are already fresh
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          python3 -c "import json,datetime as d;u=d.datetime.fromisoformat(json.load(open('data/prices.json'))['updated']);age=(d.datetime.now(d.timezone.utc)-u).total_seconds()/3600;print('age_h',round(age,1));open('$GITHUB_OUTPUT','a').write('skip='+('true' if age<6 else 'false')+'\n')"
      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != 'true'
        with: { python-version: "3.12" }
      - if: steps.fresh.outputs.skip != 'true'
        run: pip install pillow && python scripts/make_icons.py
      - if: steps.fresh.outputs.skip != 'true'
        run: python scripts/fetch_prices.py
      # ---- Sales-based signals. Raw sales stay in .cache/ (never committed); only data/signals.json is. ----
      - name: Restore sales page cache
        if: steps.fresh.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/sales-pages
          key: sales-pages-${{ github.run_id }}
          restore-keys: sales-pages-
      - name: Scrape sold listings (1 req/s, 12h page cache)
        id: scrape
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true            # failure -> keep previous data/signals.json
        timeout-minutes: 20
        run: python scripts/sales/sales_scraper.py --watchlist data/watchlist.json --max-age-h 12 --out .cache/sales/sales.json
      - name: Clean sales (wrong-bucket filter)
        id: clean
        if: steps.fresh.outputs.skip != 'true' && steps.scrape.outcome == 'success'
        continue-on-error: true
        run: python scripts/sales/clean_sales.py --sales .cache/sales/sales.json --watchlist data/watchlist.json --out .cache/sales/sales_clean.json --quarantine .cache/sales/sales_quarantine.json
      - name: Spike engine --sales
        id: spike
        if: steps.fresh.outputs.skip != 'true' && steps.clean.outcome == 'success'
        continue-on-error: true
        run: python scripts/sales/spike_engine.py --history data/history.json --prices data/prices.json --sales .cache/sales/sales_clean.json --out .cache/sales/signals.new.json
      - name: Promote signals (failsafe keeps previous data/signals.json)
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/sales/promote_signals.py --new .cache/sales/signals.new.json --dest data/signals.json
      - name: Commit snapshot
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "price-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/out && cp -r data/prices.json data/history.json data/signals.json icons /tmp/out/
          git fetch origin main && git reset --hard origin/main   # rebase onto any commits pushed during the run
          cp /tmp/out/prices.json /tmp/out/history.json /tmp/out/signals.json data/ && cp -r /tmp/out/icons .
          git add data/prices.json data/history.json data/signals.json icons
          git diff --cached --quiet || git commit -m "Price snapshot $(TZ=America/New_York date +%F)"
          git pull --rebase origin main || { git rebase --abort; git fetch origin main; git reset --hard origin/main; cp /tmp/out/prices.json /tmp/out/history.json /tmp/out/signals.json data/; git add data; git commit -m "Price snapshot (retry)"; }
          git push origin HEAD:main
          git push --force origin HEAD:gh-pages
