name: Refresh prices
on:
  schedule: [{ cron: "17 11 * * *" }]   # daily ~7:17 AM ET (11:17 UTC)
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow && python scripts/make_icons.py
      - run: python scripts/fetch_prices.py
      - name: Commit snapshot
        run: |
          git config user.name "price-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/out && cp -r data/prices.json data/history.json icons /tmp/out/
          git fetch origin main && git reset --hard origin/main   # rebase onto any commits pushed during the run
          cp /tmp/out/prices.json /tmp/out/history.json data/ && cp -r /tmp/out/icons .
          git add data/prices.json data/history.json icons
          git diff --cached --quiet || git commit -m "Price snapshot $(TZ=America/New_York date +%F)"
          git push origin HEAD:main
          git push --force origin HEAD:gh-pages
